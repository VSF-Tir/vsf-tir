<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>SIA — VSF Tir Cible</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="sia-assets/sia.css"><script src="vsf-securite.js" data-vsf-protection="admin"></script><script defer src="sia-assets/jsQR.js"></script><script defer src="sia-assets/sia.js"></script></head><body><header class="entete"><div class="nav-conteneur"><a class="logo" href="adminbarbaredestroy.html"><img class="logo-img" src="ImageSite/logo_club.png" alt="VSF Tir Cible"></a><a href="adminbarbaredestroy.html">← Réservation / Administration</a></div></header><main><div class="titre"><div><h1>SIA</h1><p>Vos comptes d’authentification</p></div><button id="ajouter">＋ Ajouter un compte</button></div><p id="statut" role="status">Vérification de la session…</p><div id="comptes"></div><button id="reessayer" hidden>Réessayer</button></main>
<dialog id="editeur"><form id="formulaire"><h2 id="titre-form">Ajouter un compte</h2><label>Nom du compte<input id="nom" required maxlength="100" autocomplete="off"></label><div class="qr-actions"><button type="button" id="scanner">Scanner avec la caméra</button><label class="bouton">Importer un QR code<input id="qr-fichier" type="file" accept="image/*" hidden></label></div><video id="camera" playsinline muted hidden></video><button type="button" id="arreter" hidden>Arrêter la caméra</button><label>Clé secrète ou lien otpauth<input id="secret" type="password" autocomplete="off" spellcheck="false" maxlength="4096"><small id="aide-secret">Saisissez la clé fournie par le service.</small></label><details><summary>Paramètres du code</summary><div class="parametres"><label>Algorithme<select id="algorithme"><option value="sha1">SHA-1</option><option value="sha256">SHA-256</option><option value="sha512">SHA-512</option></select></label><label>Chiffres<select id="chiffres"><option>6</option><option>8</option></select></label><label>Période (secondes)<input id="periode" type="number" min="10" max="300" value="30" required></label></div></details><label>Photo (facultative)<input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="apercu" alt="Photo du compte" hidden><button type="button" id="enlever-photo">Retirer la photo</button><p id="erreur" role="alert"></p><div class="actions"><button type="button" id="annuler">Annuler</button><button id="enregistrer" type="submit">Enregistrer</button></div></form></dialog></body></html>
